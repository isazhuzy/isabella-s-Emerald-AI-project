# Render deploy config for the Emerald web UI.
# In Render: New -> Blueprint -> pick this repo. Render reads this file, then prompts
# you to paste the secret values (the ones marked sync:false) in the dashboard.
services:
  - type: web
    name: emerald
    runtime: python
    # Persistent disks require Starter+ (free instances can't mount one). Starter also
    # removes idle cold-starts. NOTE: this plan change is billing-affecting — Render will
    # hold it for your approval in the dashboard before it takes effect.
    plan: starter                    # ~$7/mo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Persistent disk so output/ (candidate CSVs + per-job JSON stores) survives
    # redeploys/restarts. Mounted at the repo's output/ dir (Render checks out to
    # /opt/render/project/src). 1 GB is the minimum (~$0.25/GB/mo).
    disk:
      name: emerald-output
      mountPath: /opt/render/project/src/output
      sizeGB: 1
    envVars:
      # --- secrets: enter these in the Render dashboard (not stored in git) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEAMLESS_API_KEY
        sync: false
      - key: LOXO_API_KEY
        sync: false
      - key: LOXO_DOMAIN
        sync: false
      - key: LOXO_SLUG
        sync: false
      - key: LOXO_DEFAULT_JOB_TYPE_ID
        sync: false
      - key: LOXO_DEFAULT_COMPANY_ID
        sync: false
      - key: LOXO_NOTE_ACTIVITY_TYPE_ID
        sync: false
      # --- non-secret config ---
      - key: EMERALD_INTEGRATIONS_ENABLED
        value: "false"            # Loxo + candidate sourcing OFF on the site; "true" to re-enable
      - key: LOXO_DEFAULT_OWNER_EMAILS
        value: mark@emeraldresourcegroup.com   # job "belongs to" owner; comma-sep for co-owners
      - key: EMERALD_MODEL
        value: claude-opus-4-8
      - key: EMERALD_UI_PASSWORD
        value: emerald            # the web-UI login password; change here anytime
